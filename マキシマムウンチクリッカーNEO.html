<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マキシマム💩クリッカー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1p:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1p', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            background-color: #1a1512;
            color: #f4e8d8;
        }
        .bounce-anim {
            animation: bounce 0.12s ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.9); }
        }
        .float-text {
            position: absolute;
            animation: floatUp 0.7s ease-out forwards;
            pointer-events: none;
            font-weight: 900;
            z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
        }
        .fever-mode {
            animation: feverBg 1.5s infinite alternate;
        }
        @keyframes feverBg {
            0% { background-color: #2b152b; }
            100% { background-color: #4a1535; }
        }
        .bg-sprite {
            position: absolute;
            font-size: 1.4rem;
            opacity: 0.25;
            pointer-events: none;
            transition: transform 0.5s;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #5c4033;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between overflow-x-hidden relative">

    <!-- 背景スプライトレイヤー -->
    <div id="bg-canvas" class="absolute inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- ヘッダーエリア -->
    <header class="w-full max-w-md bg-stone-900/90 backdrop-blur border-b-2 border-amber-900/60 p-4 shadow-xl rounded-b-3xl text-center sticky top-0 z-35">
        <div class="flex justify-between items-center mb-1">
            <div class="flex items-center space-x-2">
                <h1 class="text-sm font-black tracking-wider text-amber-300">マキシマム💩クリッカー</h1>
                <button onclick="openRingsModal()" class="bg-yellow-900/60 hover:bg-yellow-800 text-yellow-300 border border-yellow-700 text-[10px] font-bold px-2 py-0.5 rounded-xl transition-all shadow-sm flex items-center space-x-1">
                    <span>💍</span><span id="header-ring-count">0/6</span>
                </button>
            </div>
            <button onclick="openResetModal()" class="bg-stone-800 hover:bg-red-950/60 text-stone-400 hover:text-red-400 border border-stone-700 text-[10px] font-bold px-2 py-1 rounded-xl transition-all shadow-sm">
                ⚙️ リセット
            </button>
        </div>
        <!-- 上部ステータス枠：高さh-16固定 -->
        <div class="mt-2 flex justify-around items-center bg-stone-950/70 px-3 py-2 rounded-2xl border border-stone-800 h-16">
            <div class="w-1/2 pr-2 text-left">
                <p class="text-[10px] text-amber-400 font-bold">所持うんち</p>
                <p id="score-display" class="text-xl md:text-2xl font-black text-amber-200 truncate">0 💩</p>
            </div>
            <div class="w-1/2 border-l border-stone-800 pl-3 text-left">
                <p class="text-[10px] text-amber-400 font-bold">秒間生産 / 永続倍率</p>
                <p id="gps-display" class="text-xs font-bold text-stone-300 truncate leading-tight">0 /秒 (x1.0000)</p>
            </div>
        </div>
        <div id="fever-bar-container" class="w-full bg-stone-950 h-2 rounded-full mt-2 overflow-hidden hidden border border-pink-900/50">
            <div id="fever-bar" class="bg-gradient-to-r from-yellow-400 to-pink-500 h-full w-full transition-all duration-100"></div>
        </div>
    </header>

    <!-- メインビジュアル＆クリックエリア -->
    <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center p-4 relative z-20">
        
        <!-- フィーバー用オニオオハシ -->
        <div id="fever-bird" class="absolute top-2 bg-pink-600 text-white font-black px-4 py-1.5 rounded-full text-xs shadow-xl animate-bounce hidden cursor-pointer border-2 border-yellow-300 flex items-center space-x-1 z-50">
            <span>🦜</span><span id="fever-bird-text">オニオオハシ出現！タップでフィーバー！</span>
        </div>

        <!-- キャラクターのセリフエリア：デフォルト2行分高さh-16固定 -->
        <div class="w-full bg-stone-900/80 backdrop-blur border-2 border-amber-800/50 rounded-2xl px-3 py-2 mb-3 shadow-md flex items-center space-x-3 h-16 overflow-hidden">
            <div id="dialogue-icon" class="text-2xl shrink-0">🦍</div>
            <p id="dialogue-text" class="text-xs font-bold text-amber-100 line-clamp-2 w-full leading-relaxed">からばいよ: 工場が稼働し始めたウホ！モリモリ生産するウホ！</p>
        </div>

        <!-- 巨大うんちクリックボタン -->
        <div class="relative flex items-center justify-center my-4">
            <div class="absolute w-48 h-48 bg-amber-500/10 rounded-full animate-ping pointer-events-none"></div>
            <button id="click-btn" class="w-44 h-44 bg-gradient-to-br from-amber-700 via-amber-900 to-stone-950 rounded-full shadow-2xl flex flex-col items-center justify-center border-4 border-amber-600/80 relative overflow-hidden group active:scale-95 transition-transform">
                <span class="text-6xl select-none filter drop-shadow-md group-hover:scale-105 transition-transform">💩</span>
                <span class="text-[10px] font-black text-amber-300/80 mt-1 tracking-widest">タップして生産</span>
            </button>
        </div>

        <!-- 黄金転生バー -->
        <div class="w-full bg-stone-900/90 border border-amber-900/40 rounded-2xl p-2.5 flex flex-col space-y-1.5 shadow-md mb-2">
            <div class="flex justify-between items-center text-xs space-x-2">
                <span id="cumulative-display" class="font-bold text-amber-200 truncate shrink">累計: 0 💩</span>
                <span id="golden-owned-display" class="font-bold text-yellow-400 bg-yellow-950/60 px-2 py-0.5 rounded-lg border border-yellow-800/50 text-[11px] shrink-0">✨所持: 0個 (+0.0%)</span>
            </div>
            <div class="flex items-center justify-between border-t border-stone-800 pt-1.5 space-x-2">
                <div class="text-[10px] text-stone-400 flex-1 min-w-0 pr-1">
                    <p class="font-bold text-stone-300">黄金転生</p>
                    <p id="next-goal-text" class="text-amber-300 font-bold truncate leading-tight">次まであと: 100兆 💩</p>
                </div>
                <button id="prestige-btn" onclick="openPrestigeModal()" class="bg-gradient-to-r from-amber-500 to-yellow-600 text-stone-950 font-black px-2.5 py-1.5 rounded-xl text-[11px] shadow hover:opacity-90 disabled:opacity-30 disabled:cursor-not-allowed transition-all shrink-0 max-w-[50%] truncate" disabled>
                    黄金転生 (条件未達)
                </button>
            </div>
        </div>

        <!-- 神格転生バー -->
        <div class="w-full bg-stone-900/90 border border-purple-900/50 rounded-2xl p-2.5 flex flex-col space-y-1.5 shadow-md">
            <div class="flex justify-between items-center text-xs space-x-2">
                <span id="divine-owned-display" class="font-bold text-purple-300 bg-purple-950/60 px-2 py-0.5 rounded-lg border border-purple-800/50 text-[11px] truncate">🌌神格: 0個 (全生産 x1.0)</span>
            </div>
            <div class="flex items-center justify-between border-t border-stone-800 pt-1.5 space-x-2">
                <div class="text-[10px] text-stone-400 flex-1 min-w-0 pr-1">
                    <p class="font-bold text-stone-300">神格転生</p>
                    <p id="divine-goal-text" class="text-purple-300 font-bold truncate leading-tight">次まであと黄金 100個</p>
                </div>
                <button id="divine-btn" onclick="openDivineModal()" class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-black px-2.5 py-1.5 rounded-xl text-[11px] shadow hover:opacity-90 disabled:opacity-30 disabled:cursor-not-allowed transition-all shrink-0 max-w-[50%] truncate" disabled>
                    神格購入 (要:100個)
                </button>
            </div>
        </div>
    </main>

    <!-- 7カテゴリーショップタブ＆パネル -->
    <nav class="w-full max-w-md bg-stone-900 border-t-2 border-stone-800 rounded-t-3xl shadow-2xl z-30">
        <div class="flex overflow-x-auto p-1.5 border-b border-stone-800 text-[10px] font-bold text-stone-400 space-x-1 custom-scrollbar">
            <button onclick="switchTab(0)" id="tab-0" class="flex-shrink-0 px-3 py-2 text-center rounded-xl bg-amber-600 text-white transition-all shadow">からばいよ</button>
            <button onclick="switchTab(1)" id="tab-1" class="flex-shrink-0 px-3 py-2 text-center rounded-xl transition-all">ニハシ</button>
            <button onclick="switchTab(2)" id="tab-2" class="flex-shrink-0 px-3 py-2 text-center rounded-xl transition-all">ロドリゴ</button>
            <button onclick="switchTab(3)" id="tab-3" class="flex-shrink-0 px-3 py-2 text-center rounded-xl transition-all">ザシアン</button>
            <button onclick="switchTab(4)" id="tab-4" class="flex-shrink-0 px-3 py-2 text-center rounded-xl transition-all">🧚プルプルマン</button>
            <button onclick="switchTab(5)" id="tab-5" class="flex-shrink-0 px-3 py-2 text-center rounded-xl transition-all">🐳ピピンゴマン</button>
            <button onclick="switchTab(6)" id="tab-6" class="flex-shrink-0 px-3 py-2 text-center rounded-xl transition-all">設備</button>
        </div>

        <!-- MAX購入ボタンバー -->
        <div class="px-3 pt-2 pb-1 bg-stone-950/40 flex justify-between items-center border-b border-stone-800/60">
            <span class="text-[10px] font-bold text-amber-400/80">解放済みの段階を限界まで一括購入</span>
            <button onclick="buyMaxCurrentTab()" class="bg-amber-700/80 hover:bg-amber-600 text-white text-[10px] font-black px-3 py-1 rounded-lg border border-amber-500/50 shadow transition-all active:scale-95 flex items-center space-x-1">
                <span>⚡ MAX購入</span>
            </button>
        </div>

        <div id="shop-container" class="p-3 h-48 overflow-y-auto space-y-2 bg-stone-950/60 custom-scrollbar"></div>
    </nav>

    <!-- メッセージモーダル -->
    <div id="msg-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-stone-900 p-6 rounded-3xl max-w-xs w-full text-center shadow-2xl border-2 border-amber-600">
            <h3 id="modal-title" class="text-base font-black text-amber-300 mb-2">お知らせ</h3>
            <div id="modal-text" class="text-xs text-stone-300 mb-4 leading-relaxed">ここにメッセージが入ります</div>
            <div id="modal-buttons" class="flex space-x-2">
                <button onclick="closeModal()" class="flex-1 bg-amber-600 text-white font-bold py-2 rounded-xl shadow hover:bg-amber-700 transition-colors text-xs">了解</button>
            </div>
        </div>
    </div>

    <!-- ウホホゴリリング図鑑モーダル -->
    <div id="rings-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-stone-900 p-5 rounded-3xl max-w-sm w-full text-center shadow-2xl border-2 border-yellow-600 flex flex-col max-h-[80vh]">
            <h3 class="text-base font-black text-yellow-300 mb-1">💍 ウホホゴリリング図鑑</h3>
            <p class="text-[10px] text-stone-400 mb-3">累計1溝💩からスタートし、1兆倍(10¹²倍)毎に到達報酬として獲得！</p>
            <div id="rings-list-container" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar text-left mb-4"></div>
            <button onclick="closeRingsModal()" class="w-full bg-yellow-600 hover:bg-yellow-700 text-stone-950 font-black py-2 rounded-xl text-xs shadow">閉じる</button>
        </div>
    </div>

    <script>
        let gameState = {
            score: 0,
            cumulative: 0,
            goldenReincarnations: 0,
            divineReincarnations: 0,
            manualPower: 1,
            autoPoopSec: 0,
            critRate: 0.05,
            critMulti: 3.0,
            autoTapCount: 0,
            synergyBonus: 1.0,
            feverActive: false,
            feverTimer: 0,
            currentTab: 0,
            rings: [],
            levels: {
                gorilla: Array(60).fill(0),
                toucan: Array(60).fill(0),
                skunk: Array(60).fill(0),
                dog: Array(60).fill(0),
                pulrupuru: Array(60).fill(0),
                pipingoman: Array(60).fill(0),
                facility: Array(60).fill(0)
            }
        };

        const ringDefinitions = [
            { id: 'ring_gorilla', name: 'ウホ王の統べる黄金の指輪', desc: '全生産効率が +50% される', icon: '💍', type: 'boost', val: 0.5, char: 'からばいよ' },
            { id: 'ring_toucan', name: '全知オオハシの眼光の指輪', desc: 'クリティカル倍率が +200% される', icon: '💍', type: 'critMulti', val: 2.0, char: 'ニハシ' },
            { id: 'ring_skunk', name: '悪臭放つ臭気王の指輪', desc: '自動タップが毎秒 +10回 増加する', icon: '💍', type: 'autoTap', val: 10, char: 'ロドリゴ' },
            { id: 'ring_dog', name: '大食漢犬神の貪欲な指輪', desc: 'タップ威力が +500% される', icon: '💍', type: 'tapPower', val: 5.0, char: 'ザシアン' },
            { id: 'ring_pulrupuru', name: 'メレメレレスラーの神髄の指輪', desc: 'クリティカル率が +15% 上昇する', icon: '💍', type: 'critRate', val: 0.15, char: 'プルプルマン' },
            { id: 'ring_pipingoman', name: '原始の深海王のプリミティブリング', desc: 'フィーバー時間が2倍になり全生産が2倍になる', icon: '💍', type: 'fever', val: 2.0, char: 'ピピンゴマン' }
        ];

        function generate60Items(baseList, type) {
            let res = [...baseList];
            for (let i = 30; i < 60; i++) {
                let orig = baseList[i % 30];
                let prefix = i < 40 ? "真・" : (i < 50 ? "裏・" : "極・");
                let stageOffset = i - 29;
                let costExp = Math.pow(10, stageOffset * 3.5);
                let item = {
                    name: prefix + orig.name,
                    cost: orig.cost * 1e16 * costExp,
                    desc: orig.desc
                };

                if (type === 'cps') {
                    item.cps = orig.cps * 1e15 * Math.pow(50, stageOffset);
                    item.desc = `毎秒 +${formatNum(item.cps)} 💩生産`;
                } else if (type === 'crit') {
                    item.critAdd = orig.critAdd * 0.2;
                    item.multAdd = orig.multAdd * 120 * stageOffset;
                    item.desc = `クリティカル倍率が +${item.multAdd.toFixed(1)} 強化`;
                } else if (type === 'autotap') {
                    item.autoTapAdd = orig.autoTapAdd + 25 * stageOffset;
                    item.desc = `自動タップが毎秒 +${item.autoTapAdd} 回増加`;
                } else if (type === 'dog') {
                    item.tapAdd = orig.tapAdd * 500000 * stageOffset;
                    item.synAdd = orig.synAdd * 20 * stageOffset;
                    item.desc = `タップ威力とシナジー効率が絶大増加`;
                } else if (type === 'pulrupuru') {
                    item.critPowerAdd = orig.critPowerAdd * 50 * stageOffset;
                    item.autoCritAdd = orig.autoCritAdd * 2.0;
                    item.desc = `ニハシ倍率と自動タップクリティカルを猛烈強化`;
                } else if (type === 'pipingoman') {
                    item.feverMultAdd = orig.feverMultAdd * 1.5 * stageOffset;
                    item.allTotalAdd = orig.allTotalAdd * 2.0 * stageOffset;
                    item.desc = `フィーバー倍率と全生産底上げを強化`;
                } else if (type === 'facility') {
                    item.allBoost = orig.allBoost * 20 * stageOffset;
                    item.desc = `全生産効率が +${(item.allBoost * 100).toFixed(1)}% 底上げ`;
                }
                res.push(item);
            }
            return res;
        }

        const baseShop = [
            generate60Items([
                {name: "大地の鼓動", cost: 45, cps: 8, desc: "毎秒 +8 💩生産"},
                {name: "ジャングル大噴火", cost: 405, cps: 40, desc: "毎秒 +40 💩生産"},
                {name: "覇王の腸内細菌", cost: 3420, cps: 160, desc: "毎秒 +160 💩生産"},
                {name: "王者の排泄領域", cost: 19800, cps: 640, desc: "毎秒 +640 💩生産"},
                {name: "暴食のゴリラ豪腕", cost: 108000, cps: 2400, desc: "毎秒 +2400 💩生産"},
                {name: "バナナ発酵タンク", cost: 585000, cps: 9600, desc: "毎秒 +9600 💩生産"},
                {name: "密林の消化メガプラント", cost: 3150000, cps: 40000, desc: "毎秒 +40000 💩生産"},
                {name: "古代ゴリラ化石発掘", cost: 16200000, cps: 160000, desc: "毎秒 +16万 💩生産"},
                {name: "マウンテン排泄ロード", cost: 85500000, cps: 640000, desc: "毎秒 +64万 💩生産"},
                {name: "絶対王政の便座", cost: 450000000, cps: 2800000, desc: "毎秒 +280万 💩生産"},
                {name: "次元歪曲ジャングル", cost: 2520000000, cps: 12000000, desc: "毎秒 +1200万 💩生産"},
                {name: "宇宙樹の肥料工場", cost: 13500000000, cps: 56000000, desc: "毎秒 +5600万 💩生産"},
                {name: "銀河系エントロピー", cost: 72000000000, cps: 240000000, desc: "毎秒 +2.4億 💩生産"},
                {name: "超新星爆発うんち", cost: 405000000000, cps: 1200000000, desc: "毎秒 +12億 💩生産"},
                {name: "神域ゴリラファクトリー", cost: 2250000000000, cps: 5600000000, desc: "毎秒 +56億 💩生産"},
                {name: "プライマル・ジャングル", cost: 12600000000000, cps: 25600000000, desc: "毎秒 +256億 💩生産"},
                {name: "太古の王者ロード", cost: 67500000000000, cps: 120000000000, desc: "毎秒 +1200億 💩生産"},
                {name: "ゴリラ神の降臨地", cost: 360000000000000, cps: 560000000000, desc: "毎秒 +5600億 💩生産"},
                {name: "究極ウホウホタワー", cost: 1980000000000000, cps: 2560000000000, desc: "毎秒 +2.5兆 💩生産"},
                {name: "バナナ銀河連邦", cost: 10800000000000000, cps: 12000000000000, desc: "毎秒 +12兆 💩生産"},
                {name: "永遠の霊長類宮殿", cost: 58500000000000000, cps: 56000000000000, desc: "毎秒 +56兆 💩生産"},
                {name: "マウンテン・コア", cost: 315000000000000000, cps: 256000000000352, desc: "毎秒 +256兆 💩生産"},
                {name: "超ウホ次元ゲート", cost: 1710000000000000000, cps: 1200000000000000, desc: "毎秒 +1200兆 💩生産"},
                {name: "絶対零度バナナ", cost: 9000000000000000000, cps: 5600000000000000, desc: "毎秒 +5600兆 💩生産"},
                {name: "キングコングの棺", cost: 49500000000000000000, cps: 25600000000000000, desc: "毎秒 +1.5京 💩生産"},
                {name: "無限ジャングル回廊", cost: 270000000000000000000, cps: 120000000000000000, desc: "毎秒 +12京 💩生産"},
                {name: "神聖ウホ神殿", cost: 1440000000000000000000, cps: 560000000000000000, desc: "毎秒 +56京 💩生産"},
                {name: "天界ゴリラハイウェイ", cost: 8100000000000000000000, cps: 2560000000000000000, desc: "毎秒 +2.5垓 💩生産"},
                {name: "全能ウホの座", cost: 45000000000000000000000, cps: 12000000000000000000, desc: "毎秒 +12垓 💩生産"},
                {name: "ウホ・オメガ・ジ・エンド", cost: 252000000000000000000000, cps: 56000000000000000000, desc: "毎秒 +56垓 💩生産"}
            ], 'cps'),

            generate60Items([
                {name: "ワカルの真髄", cost: 80, critAdd: 0.02, multAdd: 0.3, desc: "クリティカル率と倍率が上昇する"},
                {name: "フカメル深層思考", cost: 600, critAdd: 0.02, multAdd: 0.4, desc: "クリティカル性能が強化される"},
                {name: "黄金クチバシの閃き", cost: 3500, critAdd: 0.03, multAdd: 0.5, desc: "クリティカル性能が強化される"},
                {name: "全知全能のワカル", cost: 18000, critAdd: 0.03, multAdd: 0.6, desc: "クリティカル性能が強化される"},
                {name: "電脳オオハシの眼", cost: 90000, critAdd: 0.04, multAdd: 0.8, desc: "クリティカル性能が強化される"},
                {name: "鋭利な思考回路", cost: 450000, critAdd: 0.04, multAdd: 1.0, desc: "クリティカル性能が強化される"},
                {name: "神託のオニオオハシ", cost: 2200000, critAdd: 0.05, multAdd: 1.2, desc: "クリティカル性能が強化される"},
                {name: "究極ワカルビーム", cost: 11000000, critAdd: 0.05, multAdd: 1.5, desc: "クリティカル性能が強化される"},
                {name: "哲学のクチバシ", cost: 55000000, critAdd: 0.06, multAdd: 2.0, desc: "クリティカル性能が強化される"},
                {name: "宇宙理の解明", cost: 280000000, critAdd: 0.07, multAdd: 2.5, desc: "クリティカル性能が強化される"},

        function getMaxUnlockedStage(divineCount) {
            return Math.min(60, 30 + divineCount * 5);
        }

        function getRequiredDivineForStage(stageIndex) {
            if (stageIndex < 30) return 0;
            return Math.ceil((stageIndex - 29) / 5);
        }

        function getItemCost(item, currentLevel) {
            return Math.floor(item.cost * Math.pow(1.28, currentLevel));
        }

        function calculateGoldenGains() {
            const baseTarget = 1e14;
            if (gameState.cumulative < baseTarget) return 0;
            return Math.floor(Math.pow(gameState.cumulative / baseTarget, 0.20));
        }

        function getNextGoalCumulative(currentRunGained) {
            const baseTarget = 1e14;
            const targetCount = currentRunGained + 1;
            return Math.pow(targetCount, 5) * baseTarget;
        }

        function getNextDivineCost(currentDivine) {
            const targetDivine = currentDivine + 1;
            if (targetDivine === 1) return 100;
            if (targetDivine === 2) return 500;
            if (targetDivine === 3) return 2500;
            return Math.ceil(Math.pow(targetDivine, 5.0) * 10000);
        }

        function gameLoop() {
            checkRings();

            let divineMultiplier = Math.pow(1.5, gameState.divineReincarnations);
            let reincMultiplier = (1 + (0.005 * gameState.goldenReincarnations)) * divineMultiplier;
            
            let facilityBoostSum = 0;
            gameState.levels.facility.forEach((lvl, idx) => {
                facilityBoostSum += lvl * baseShop[6][idx].allBoost;
            });
            let facilityMultiplier = 1 + facilityBoostSum;

            let totalPurchasedLevels = 0;
            Object.keys(gameState.levels).forEach(k => {
                gameState.levels[k].forEach(lv => totalPurchasedLevels += lv);
            });
            let pipingomanTotalBoost = 1;
            gameState.levels.pipingoman.forEach((lvl, idx) => {
                pipingomanTotalBoost += lvl * baseShop[5][idx].allTotalAdd;
            });
            pipingomanTotalBoost += totalPurchasedLevels * 0.00001;

            let ringBoost = 1.0;
            if (gameState.rings && gameState.rings.includes('ring_gorilla')) ringBoost += 0.5;
            if (gameState.rings && gameState.rings.includes('ring_pipingoman')) ringBoost *= 2.0;

            let autoPoopSum = 0;
            gameState.levels.gorilla.forEach((lvl, idx) => { autoPoopSum += lvl * baseShop[0][idx].cps; });

            let totalSynergy = 1.0;
            gameState.levels.dog.forEach((lvl, idx) => { totalSynergy += lvl * baseShop[3][idx].synAdd; });

            let totalGps = autoPoopSum * totalSynergy * facilityMultiplier * pipingomanTotalBoost * ringBoost * reincMultiplier;

            let currentFeverDuration = 30000;
            if (gameState.rings && gameState.rings.includes('ring_pipingoman')) currentFeverDuration = 60000;

            if (gameState.feverActive) {
                let feverBonus = 7;
                gameState.levels.pipingoman.forEach((lvl, idx) => {
                    feverBonus += lvl * baseShop[5][idx].feverMultAdd;
                });
                totalGps *= feverBonus;
            }

            let earnedPerTick = totalGps / 10;
            if (earnedPerTick > 0) {
                gameState.score += earnedPerTick;
                gameState.cumulative += earnedPerTick;
            }

            let totalAutoTap = 0;
            gameState.levels.skunk.forEach((lvl, idx) => { totalAutoTap += lvl * baseShop[2][idx].autoTapAdd; });
            if (gameState.rings && gameState.rings.includes('ring_skunk')) totalAutoTap += 10;

            if (totalAutoTap > 0) {
                let autoClicksPerTick = totalAutoTap / 10;
                if (Math.random() < autoClicksPerTick || autoClicksPerTick >= 1) {
                    let pulrupuruCritChance = 0;
                    gameState.levels.pulrupuru.forEach((lvl, idx) => {
                        pulrupuruCritChance += lvl * baseShop[4][idx].autoCritAdd;
                    });
                    if (gameState.rings && gameState.rings.includes('ring_pulrupuru')) pulrupuruCritChance += 0.15;

                    let isAutoCrit = Math.random() < pulrupuruCritChance;
                    let pulrupuruPowerAdd = 0;
                    gameState.levels.pulrupuru.forEach((lvl, idx) => {
                        pulrupuruPowerAdd += lvl * baseShop[4][idx].critPowerAdd;
                    });
                    let ringCritMultiAdd = (gameState.rings && gameState.rings.includes('ring_toucan')) ? 2.0 : 0;

                    let baseCritMulti = gameState.critMulti;
                    gameState.levels.toucan.forEach((lvl, idx) => { baseCritMulti += lvl * baseShop[1][idx].multAdd; });

                    let effectiveCritMulti = baseCritMulti + pulrupuruPowerAdd + ringCritMultiAdd;

                    let manualPowerSum = 1;
                    gameState.levels.dog.forEach((lvl, idx) => { manualPowerSum += lvl * baseShop[3][idx].tapAdd; });
                    let ringTapPowerBoost = (gameState.rings && gameState.rings.includes('ring_dog')) ? 5.0 : 0.0;

                    let autoPower = (manualPowerSum + ringTapPowerBoost) * totalSynergy * facilityMultiplier * pipingomanTotalBoost * ringBoost * reincMultiplier;
                    if (isAutoCrit) autoPower *= effectiveCritMulti;
                    if (gameState.feverActive) {
                        let feverBonus = 7;
                        gameState.levels.pipingoman.forEach((lvl, idx) => {
                            feverBonus += lvl * baseShop[5][idx].feverMultAdd;
                        });
                        autoPower *= feverBonus;
                    }
                    gameState.score += autoPower;
                    gameState.cumulative += autoPower;
                }
            }

            if (gameState.feverActive) {
                gameState.feverTimer -= 100;
                if (gameState.feverTimer <= 0) {
                    gameState.feverActive = false;
                    document.getElementById('fever-bar-container').classList.add('hidden');
                    document.body.classList.remove('fever-mode');
                    document.getElementById('dialogue-icon').innerText = '🦜';
                    document.getElementById('dialogue-text').innerText = 'ニハシ: ﾜｶﾗﾅｲ';
                } else {
                    let pct = (gameState.feverTimer / currentFeverDuration) * 100;
                    document.getElementById('fever-bar').style.width = pct + '%';
                }
            }

            updateUI();
        }

            let pipingomanTotalBoost = 1;
            gameState.levels.pipingoman.forEach((lvl, idx) => {
                pipingomanTotalBoost += lvl * baseShop[5][idx].allTotalAdd;
            });
            pipingomanTotalBoost += totalPurchasedLevels * 0.00001;

            let ringBoost = 1.0;
            if (gameState.rings && gameState.rings.includes('ring_gorilla')) ringBoost += 0.5;
            if (gameState.rings && gameState.rings.includes('ring_pipingoman')) ringBoost *= 2.0;

            let autoPoopSum = 0;
            gameState.levels.gorilla.forEach((lvl, idx) => { autoPoopSum += lvl * baseShop[0][idx].cps; });

            let totalSynergy = 1.0;
            gameState.levels.dog.forEach((lvl, idx) => { totalSynergy += lvl * baseShop[3][idx].synAdd; });

            let totalGps = autoPoopSum * totalSynergy * facilityMultiplier * pipingomanTotalBoost * ringBoost * reincMultiplier;
            if (gameState.feverActive) {
                let feverBonus = 7;
                gameState.levels.pipingoman.forEach((lvl, idx) => {
                    feverBonus += lvl * baseShop[5][idx].feverMultAdd;
                });
                totalGps *= feverBonus;
            }

            let gpsText = formatNum(totalGps.toFixed(1)) + ' /秒 (x' + formatNum(reincMultiplier) + ')';
            if (gameState.feverActive) {
                gpsText = `🔥 フィーバー中 残り ${Math.ceil(gameState.feverTimer/1000)}秒 🔥`;
            }
            document.getElementById('gps-display').innerText = gpsText;
            document.getElementById('cumulative-display').innerText = '累計: ' + formatNum(Math.floor(gameState.cumulative)) + ' 💩';

            let totalBonus = (gameState.goldenReincarnations * 0.5).toFixed(1);
            document.getElementById('golden-owned-display').innerText = `✨所持: ${formatNum(gameState.goldenReincarnations)}個 (+${totalBonus}%)`;

            let currentRunGained = calculateGoldenGains();
            let nextGoal = getNextGoalCumulative(currentRunGained);
            let diff = nextGoal - gameState.cumulative;
            if (diff < 0) diff = 0;
            document.getElementById('next-goal-text').innerText = `次(+${currentRunGained + 1}個)まであと: ${formatNum(Math.ceil(diff))} 💩`;

            const pBtn = document.getElementById('prestige-btn');
            if (currentRunGained > 0) {
                pBtn.disabled = false;
                pBtn.innerText = `黄金転生 (+${formatNum(currentRunGained)}個)`;
            } else {
                pBtn.disabled = true;
                pBtn.innerText = '黄金転生 (条件未達)';
            }

            document.getElementById('divine-owned-display').innerText = `🌌神格: ${formatNum(gameState.divineReincarnations)}個 (全生産 x${formatNum(divineMultiplier)})`;
            let nextCost = getNextDivineCost(gameState.divineReincarnations);
            let goldenDiff = nextCost - gameState.goldenReincarnations;
            if (goldenDiff < 0) goldenDiff = 0;

            const dBtn = document.getElementById('divine-btn');
            if (gameState.goldenReincarnations >= nextCost) {
                dBtn.disabled = false;
                dBtn.innerText = `神格購入 (コスト:${formatNum(nextCost)}個)`;
                document.getElementById('divine-goal-text').innerText = `次(+1個)まで条件達成！購入可能`;
            } else {
                dBtn.disabled = true;
                dBtn.innerText = `神格購入 (要:${formatNum(nextCost)}個)`;
                document.getElementById('divine-goal-text').innerText = `次(+1個)まであと黄金 ${formatNum(goldenDiff)}個`;
            }
        }

        function formatNum(num) {
            if (typeof num === 'string') num = parseFloat(num);
            if (isNaN(num) || !isFinite(num)) return "∞ (測定不能)";
            if (num > 1.79e308) return "MAX (オーバーフロー)";

            if (num >= 1e68) return num.toExponential(2);
            if (num >= 1e64) return (num / 1e64).toFixed(2) + '不可思議';
            if (num >= 1e60) return (num / 1e60).toFixed(2) + '那由多';
            if (num >= 1e56) return (num / 1e56).toFixed(2) + '阿僧祇';
            if (num >= 1e52) return (num / 1e52).toFixed(2) + '恒河沙';
            if (num >= 1e48) return (num / 1e48).toFixed(2) + '極';
            if (num >= 1e44) return (num / 1e44).toFixed(2) + '載';
            if (num >= 1e40) return (num / 1e40).toFixed(2) + '正';
            if (num >= 1e36) return (num / 1e36).toFixed(2) + '澗';
            if (num >= 1e32) return (num / 1e32).toFixed(2) + '溝';
            if (num >= 1e28) return (num / 1e28).toFixed(2) + '穣';
            if (num >= 1e24) return (num / 1e24).toFixed(2) + '🪷';
            if (num >= 1e20) return (num / 1e20).toFixed(2) + '🪸';
            if (num >= 1e16) return (num / 1e16).toFixed(2) + '京';
            if (num >= 1e12) return (num / 1e12).toFixed(2) + '兆';
            if (num >= 1e8) return (num / 1e8).toFixed(2) + '億';
            if (num >= 1e4) return (num / 1e4).toFixed(1) + '万';
            return num.toLocaleString();
        }

        function renderTabs() {
            let tabNames = ['からばいよ', 'ニハシ', 'ロドリゴ', 'ザシアン', '🧚プルプルマン', '🐳ピピンゴマン', '設備'];
            for(let i=0; i<7; i++) {
                const btn = document.getElementById(`tab-${i}`);
                if (!btn) continue;
                let isLocked = false;
                let text = tabNames[i];
                if (i === 4 && gameState.divineReincarnations < 1) {
                    isLocked = true;
                    text = "🔒 プルプルマン(神格1)";
                } else if (i === 5 && gameState.divineReincarnations < 3) {
                    isLocked = true;
                    text = "🔒 ピピンゴマン(神格3)";
                }
                btn.innerText = text;

                if(i === gameState.currentTab) {
                    btn.className = "flex-shrink-0 px-3 py-2 text-center rounded-xl bg-amber-600 text-white font-bold transition-all shadow";
                } else {
                    btn.className = `flex-shrink-0 px-3 py-2 text-center rounded-xl transition-all ${isLocked ? 'text-stone-600 bg-stone-950/40' : 'text-stone-400'}`;
                }
            }
        }

        function switchTab(idx) {
            if (idx === 4 && gameState.divineReincarnations < 1) {
                showModal("🔒 キャラクターロック中", "プルプルマンは <span class='text-purple-400 font-bold'>神格転生 1回以上</span> で解放されます！");
                return;
            }
            if (idx === 5 && gameState.divineReincarnations < 3) {
                showModal("🔒 キャラクターロック中", "ピピンゴマンは <span class='text-purple-400 font-bold'>神格転生 3回以上</span> で解放されます！");
                return;
            }
            gameState.currentTab = idx;
            renderTabs();
            renderShop();
        }

        function renderShop() {
            const container = document.getElementById('shop-container');
            container.innerHTML = '';
            let cat = gameState.currentTab;
            let items = baseShop[cat];
            let catKey = ['gorilla', 'toucan', 'skunk', 'dog', 'pulrupuru', 'pipingoman', 'facility'][cat];
            let maxUnlockedIndex = getMaxUnlockedStage(gameState.divineReincarnations);

            items.forEach((item, idx) => {
                let currentLevel = gameState.levels[catKey][idx];
                let currentCost = getItemCost(item, currentLevel);
                let isLockedStage = idx >= maxUnlockedIndex;
                let reqDivine = getRequiredDivineForStage(idx);
                
                let div = document.createElement('div');
                div.className = `p-2.5 rounded-2xl border flex items-center justify-between shadow-sm ${isLockedStage ? 'bg-stone-950/80 border-stone-800/60 opacity-60' : 'bg-stone-900 border-stone-800'}`;
                div.innerHTML = `
                    <div class="pr-2">
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-xs ${isLockedStage ? 'text-stone-500' : 'text-amber-200'}">${item.name}</span>
                            <span id="shop-lv-${cat}-${idx}" class="text-[10px] bg-amber-950 text-amber-400 px-1.5 py-0.5 rounded-md font-bold">Lv.${currentLevel}</span>
                        </div>
                        <p class="text-[10px] ${isLockedStage ? 'text-stone-600' : 'text-stone-400'} mt-0.5">${item.desc}</p>
                        <p id="shop-cost-${cat}-${idx}" class="text-[10px] font-black ${isLockedStage ? 'text-purple-400' : 'text-amber-500'} mt-0.5">${isLockedStage ? '🔒 要: 神格転生 ' + reqDivine + '回' : '費用: ' + formatNum(currentCost) + ' 💩'}</p>
                    </div>
                `;
                let btn = document.createElement('button');
                btn.id = `shop-btn-${cat}-${idx}`;
                btn.className = "bg-amber-600 text-white text-xs font-bold px-3 py-2 rounded-xl shadow hover:bg-amber-700 active:scale-95 transition-all flex-shrink-0 disabled:opacity-30 disabled:cursor-not-allowed";
                btn.innerText = isLockedStage ? "ロック" : "購入";
                if (isLockedStage) btn.disabled = true;
                
                let shopHoldTimer = null;
                let shopIntervalTimer = null;

                const clearShopHold = () => {
                    if (shopHoldTimer) { clearTimeout(shopHoldTimer); shopHoldTimer = null; }
                    if (shopIntervalTimer) { clearInterval(shopIntervalTimer); shopIntervalTimer = null; }
                };

                if (!isLockedStage) {
                    btn.addEventListener('pointerdown', (e) => {
                        e.stopPropagation();
                        buyItem(cat, idx);

                        shopHoldTimer = setTimeout(() => {
                            if (shopIntervalTimer) clearInterval(shopIntervalTimer);
                            shopIntervalTimer = setInterval(() => {
                                buyItem(cat, idx);
                            }, 100);
                        }, 400);
                    });

                    btn.addEventListener('pointerup', clearShopHold);
                    btn.addEventListener('pointercancel', clearShopHold);
                    btn.addEventListener('mouseleave', clearShopHold);
                }

                div.appendChild(btn);
                container.appendChild(div);
            });
        }

        function buyItem(cat, idx) {
            let maxUnlockedIndex = getMaxUnlockedStage(gameState.divineReincarnations);
            if (idx >= maxUnlockedIndex) return;

            let catKey = ['gorilla', 'toucan', 'skunk', 'dog', 'pulrupuru', 'pipingoman', 'facility'][cat];
            let item = baseShop[cat][idx];
            let currentLevel = gameState.levels[catKey][idx];
            let currentCost = getItemCost(item, currentLevel);

            if (gameState.score >= currentCost) {
                gameState.score -= currentCost;
                gameState.levels[catKey][idx]++;
                
                let newLevel = gameState.levels[catKey][idx];
                let nextCost = getItemCost(item, newLevel);
                let lvEl = document.getElementById(`shop-lv-${cat}-${idx}`);
                let costEl = document.getElementById(`shop-cost-${cat}-${idx}`);
                if (lvEl) lvEl.innerText = `Lv.${newLevel}`;
                if (costEl) costEl.innerText = `費用: ${formatNum(nextCost)} 💩`;

                updateBackgroundSprites();
                updateUI();
                saveGame();
            }
        }

        function buyMaxCurrentTab() {
            let cat = gameState.currentTab;
            let catKey = ['gorilla', 'toucan', 'skunk', 'dog', 'pulrupuru', 'pipingoman', 'facility'][cat];
            let items = baseShop[cat];
            let maxUnlockedIndex = getMaxUnlockedStage(gameState.divineReincarnations);
            let purchasedAny = false;
            let safetyCounter = 0;

            while (safetyCounter < 1000) {
                let boughtInThisRound = false;
                for (let idx = 0; idx < maxUnlockedIndex; idx++) {
                    let item = items[idx];
                    let currentLevel = gameState.levels[catKey][idx];
                    let currentCost = getItemCost(item, currentLevel);

                    if (gameState.score >= currentCost) {
                        gameState.score -= currentCost;
                        gameState.levels[catKey][idx]++;
                        purchasedAny = true;
                        boughtInThisRound = true;
                    }
                }
                if (!boughtInThisRound) break;
                safetyCounter++;
            }

            if (purchasedAny) {
                renderShop();
                updateBackgroundSprites();
                updateUI();
                saveGame();
            }
        }

        function checkRings() {
            let baseGoal = 1e32;
            let earnedCount = gameState.rings ? gameState.rings.length : 0;
            if (earnedCount >= 6) return;
            let nextGoal = baseGoal * Math.pow(1e12, earnedCount);
            if (gameState.cumulative >= nextGoal) {
                let unowned = ringDefinitions.filter(r => !gameState.rings.includes(r.id));
                if (unowned.length > 0) {
                    let newRing = unowned[Math.floor(Math.random() * unowned.length)];
                    if (!gameState.rings) gameState.rings = [];
                    gameState.rings.push(newRing.id);
                    showModal("💍 ウホホゴリリング獲得！", `累計うんちが条件に達し、新たな指輪を手に入れたウホ！<br><br><b class="text-yellow-300 text-sm">${newRing.icon} ${newRing.name}</b><br><span class="text-xs text-amber-200">${newRing.desc}</span>`);
                    saveGame();
                }
            }
        }

        function openRingsModal() {
            const container = document.getElementById('rings-list-container');
            container.innerHTML = '';
            ringDefinitions.forEach(r => {
                let owned = gameState.rings && gameState.rings.includes(r.id);
                let div = document.createElement('div');
                div.className = `p-2.5 rounded-2xl border flex items-center space-x-3 ${owned ? 'bg-yellow-950/40 border-yellow-700/60 text-yellow-200' : 'bg-stone-950/60 border-stone-800 text-stone-600'}`;
                div.innerHTML = `
                    <div class="text-2xl">${owned ? r.icon : '🔒'}</div>
                    <div>
                        <p class="text-xs font-black ${owned ? 'text-yellow-300' : 'text-stone-500'}">${owned ? r.name : '未獲得のウホホゴリリング'}</p>
                        <p class="text-[10px] ${owned ? 'text-amber-100' : 'text-stone-600'}">${owned ? r.desc : '条件到達でランダム解放されます'}</p>
                    </div>
                `;
                container.appendChild(div);
            });
            document.getElementById('rings-modal').classList.remove('hidden');
        }

        function closeRingsModal() {
            document.getElementById('rings-modal').classList.add('hidden');
        }

        function openPrestigeModal() {
            let netNew = calculateGoldenGains();
            if (netNew <= 0) {
                showModal("黄金転生", "まだ転生による獲得はありません。さらに累計うんちを稼ぐウホ！");
                return;
            }

            document.getElementById('modal-title').innerText = "✨ 黄金転生発動 ✨";
            document.getElementById('modal-text').innerHTML = `
                現在の累計うんちで転生すると、<br>
                新たに <span class="text-yellow-400 font-black text-sm">+${netNew}個</span> の黄金うんちを獲得できます！<br>
                <span class="text-[10px] text-stone-400 mt-2 block">※スコア、設備、ショップレベル、今回周の累計うんちがリセットされます。</span>
            `;
            document.getElementById('modal-buttons').innerHTML = `
                <button onclick="closeModal()" class="flex-1 bg-stone-700 text-stone-300 font-bold py-2 rounded-xl text-xs">キャンセル</button>
                <button onclick="executePrestige(${netNew})" class="flex-1 bg-gradient-to-r from-amber-500 to-yellow-600 text-stone-950 font-black py-2 rounded-xl text-xs shadow">転生する</button>
            `;
            document.getElementById('msg-modal').classList.remove('hidden');
        }

        function executePrestige(gainedGolden) {
            gameState.goldenReincarnations += gainedGolden;
            gameState.score = 0;
            gameState.cumulative = 0;
            gameState.manualPower = 1 + (gameState.goldenReincarnations * 0.5);
            gameState.autoPoopSec = 0;
            gameState.critRate = 0.05;
            gameState.critMulti = 3.0;
            gameState.autoTapCount = 0;
            gameState.synergyBonus = 1.0;
            gameState.levels = {
                gorilla: Array(60).fill(0),
                toucan: Array(60).fill(0),
                skunk: Array(60).fill(0),
                dog: Array(60).fill(0),
                pulrupuru: Array(60).fill(0),
                pipingoman: Array(60).fill(0),
                facility: Array(60).fill(0)
            };
            closeModal();
            renderTabs();
            renderShop();
            updateBackgroundSprites();
            updateUI();
            saveGame();
            showModal("転生完了", "黄金転生を果たしたウホ！新たな力でさらにモリモリ生産するウホ！");
        }

        function openDivineModal() {
            let nextCost = getNextDivineCost(gameState.divineReincarnations);
            if (gameState.goldenReincarnations < nextCost) {
                showModal("🌌 神格購入", `黄金うんちが足りません（必要: ${formatNum(nextCost)}個）`);
                return;
            }

            let nextUnlocked = getMaxUnlockedStage(gameState.divineReincarnations + 1);

            document.getElementById('modal-title').innerText = "🌌 神格購入確認 🌌";
            document.getElementById('modal-text').innerHTML = `
                黄金うんちを <span class="text-amber-400 font-black">${formatNum(nextCost)}個</span> 消費して、<br>
                神格を <span class="text-purple-400 font-black text-sm">+1個</span> 獲得（現在 ${gameState.divineReincarnations}個 → ${gameState.divineReincarnations + 1}個）します！<br>
                <span class="text-[10px] text-stone-400 mt-2 block">※購入可能な段階の上限が ${nextUnlocked}段階目 まで拡張されます！</span>
            `;
            document.getElementById('modal-buttons').innerHTML = `
                <button onclick="closeModal()" class="flex-1 bg-stone-700 text-stone-300 font-bold py-2 rounded-xl text-xs">キャンセル</button>
                <button onclick="executeDivine(${nextCost})" class="flex-1 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-black py-2 rounded-xl text-xs shadow">購入して神格転生</button>
            `;
            document.getElementById('msg-modal').classList.remove('hidden');
        }

        function executeDivine(cost) {
            gameState.goldenReincarnations -= cost;
            gameState.divineReincarnations += 1;
            
            gameState.score = 0;
            gameState.cumulative = 0;
            gameState.manualPower = 1 + (gameState.goldenReincarnations * 0.5);
            gameState.autoPoopSec = 0;
            gameState.critRate = 0.05;
            gameState.critMulti = 3.0;
            gameState.autoTapCount = 0;
            gameState.synergyBonus = 1.0;
            gameState.levels = {
                gorilla: Array(60).fill(0),
                toucan: Array(60).fill(0),
                skunk: Array(60).fill(0),
                dog: Array(60).fill(0),
                pulrupuru: Array(60).fill(0),
                pipingoman: Array(60).fill(0),
                facility: Array(60).fill(0)
            };
            closeModal();
            renderTabs();
            renderShop();
            updateBackgroundSprites();
            updateUI();
            saveGame();
            showModal("神格降臨", "神格降臨を果たしたウホ！購入可能段階の上限が5つ解放されたウホ！");
        }

        function openResetModal() {
            document.getElementById('modal-title').innerText = "⚠️ 全データリセット";
            document.getElementById('modal-text').innerText = "本当に全てのセーブデータを消去して初期化しますか？この操作は取り消せません。";
            document.getElementById('modal-buttons').innerHTML = `
                <button onclick="closeModal()" class="flex-1 bg-stone-700 text-stone-300 font-bold py-2 rounded-xl text-xs">キャンセル</button>
                <button onclick="resetGameData()" class="flex-1 bg-red-700 text-white font-black py-2 rounded-xl text-xs shadow">完全リセット</button>
            `;
            document.getElementById('msg-modal').classList.remove('hidden');
        }

        function resetGameData() {
            localStorage.removeItem('maximum_poop_clicker_save_v14');
            location.reload();
        }

        function showModal(title, text) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerHTML = text;
            document.getElementById('modal-buttons').innerHTML = `<button onclick="closeModal()" class="flex-1 bg-amber-600 text-white font-bold py-2 rounded-xl shadow hover:bg-amber-700 transition-colors text-xs">了解</button>`;
            document.getElementById('msg-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('msg-modal').classList.add('hidden');
        }

        function saveGame() {
            localStorage.setItem('maximum_poop_clicker_save_v14', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('maximum_poop_clicker_save_v14');
            if (saved) {
                try {
                    let parsed = JSON.parse(saved);
                    gameState = Object.assign(gameState, parsed);
                    Object.keys(gameState.levels).forEach(k => {
                        if (gameState.levels[k].length < 60) {
                            let pad = Array(60 - gameState.levels[k].length).fill(0);
                            gameState.levels[k] = gameState.levels[k].concat(pad);
                        }
                    });
                } catch(e) {
                    console.error("Failed to load save", e);
                }
            }
        }

        function updateBackgroundSprites() {
            const canvas = document.getElementById('bg-canvas');
            canvas.innerHTML = '';

            let baseIcons = ['💩', '🍌', '✨', '🌌', '💍'];
            
            let gorillaTotal = gameState.levels.gorilla.reduce((a, b) => a + b, 0);
            let toucanTotal = gameState.levels.toucan.reduce((a, b) => a + b, 0);
            let skunkTotal = gameState.levels.skunk.reduce((a, b) => a + b, 0);
            let dogTotal = gameState.levels.dog.reduce((a, b) => a + b, 0);
            let pulrupuruTotal = gameState.levels.pulrupuru.reduce((a, b) => a + b, 0);
            let pipingomanTotal = gameState.levels.pipingoman.reduce((a, b) => a + b, 0);

            let iconPool = [...baseIcons];
            for(let i=0; i<Math.min(gorillaTotal, 10); i++) iconPool.push('🦍');
            for(let i=0; i<Math.min(toucanTotal, 10); i++) iconPool.push('🦜');
            for(let i=0; i<Math.min(skunkTotal, 10); i++) iconPool.push('🦨');
            for(let i=0; i<Math.min(dogTotal, 10); i++) iconPool.push('🐕');
            for(let i=0; i<Math.min(pulrupuruTotal, 10); i++) iconPool.push('🧚');
            for(let i=0; i<Math.min(pipingomanTotal, 10); i++) iconPool.push('🐳');

            let totalSprites = Math.min(15 + gorillaTotal + toucanTotal + skunkTotal + dogTotal + pulrupuruTotal + pipingomanTotal, 120);

            for(let i=0; i<totalSprites; i++) {
                let span = document.createElement('span');
                span.className = 'bg-sprite';
                span.innerText = iconPool[Math.floor(Math.random() * iconPool.length)];
                span.style.top = (Math.random() * 100) + '%';
                span.style.left = (Math.random() * 100) + '%';
                
                let scale = 0.8 + Math.random() * 0.8;
                span.style.transform = `scale(${scale})`;
                
                canvas.appendChild(span);
            }
        }
    </script>
</body>
</html>
