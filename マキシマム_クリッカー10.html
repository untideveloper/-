    <style>
        body {
            font-family: 'M PLUS Rounded 1p', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            background-color: #1a1512;
            color: #f4e8d8;
        }
        .bounce-anim {
            animation: bounce 0.12s ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.9); }
        }
        .float-text {
            position: absolute;
            animation: floatUp 0.7s ease-out forwards;
            pointer-events: none;
            font-weight: 900;
            z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
        }
        .fever-mode {
            animation: feverBg 1.5s infinite alternate;
        }
        @keyframes feverBg {
            0% { background-color: #2b152b; }
            100% { background-color: #4a1535; }
        }
        .bg-sprite {
            position: absolute;
            font-size: 1.4rem;
            opacity: 0.25;
            pointer-events: none;
            transition: transform 0.3s;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #5c4033;
            border-radius: 4px;
        }
    </style>
</head>

        // 周回ごとの累計うんち(gameState.cumulative)に応じた今回獲得できる黄金うんち数 (0.25に緩和)
        function calculateGoldenGains() {
            const baseTarget = 1e14; // 100兆
            if (gameState.cumulative < baseTarget) return 0;
            return Math.floor(Math.pow(gameState.cumulative / baseTarget, 0.25));
        }

        // 次の1個（または次の目標数）を獲得するために必要な周回累計うんち目標値 (1/0.25に緩和)
        function getNextGoalCumulative(currentRunGained) {
            const baseTarget = 1e14;
            const targetCount = currentRunGained + 1;
            return Math.pow(targetCount, 1 / 0.25) * baseTarget;
        }

        // 神格転生獲得数 (0.35に緩和)
        function calculateDivineGains() {
            if (gameState.goldenReincarnations < 50) return 0;
            const baseDivineTarget = 50;
            return Math.floor(Math.pow(gameState.goldenReincarnations / baseDivineTarget, 0.35));
        }

        // 神格転生目標値 (1/0.35に緩和)
        function getNextDivineGoal(currentDivineGained) {
            const baseDivineTarget = 50;
            const targetCount = currentDivineGained + 1;
            return Math.ceil(Math.pow(targetCount, 1 / 0.35) * baseDivineTarget);
        }

        function gameLoop() {
            let divineMultiplier = Math.pow(2.0, gameState.divineReincarnations);
            let reincMultiplier = (1 + (0.005 * gameState.goldenReincarnations)) * divineMultiplier;
            let facilityBoostSum = 0;
            gameState.levels.facility.forEach((lvl, idx) => {
                facilityBoostSum += lvl * shopDatabase[4][idx].allBoost;
            });
            let facilityMultiplier = 1 + facilityBoostSum;
            let totalGps = gameState.autoPoopSec * gameState.synergyBonus * facilityMultiplier * reincMultiplier;

            if (gameState.feverActive) totalGps *= 7;

            let earnedPerTick = totalGps / 10;
            if (earnedPerTick > 0) {
                gameState.score += earnedPerTick;
                gameState.cumulative += earnedPerTick;
            }

            if (gameState.autoTapCount > 0) {
                let autoClicksPerTick = gameState.autoTapCount / 10;
                if (Math.random() < autoClicksPerTick || autoClicksPerTick >= 1) {
                    let autoPower = gameState.manualPower * gameState.synergyBonus * facilityMultiplier * reincMultiplier;
                    if (gameState.feverActive) autoPower *= 7;
                    gameState.score += autoPower;
                    gameState.cumulative += autoPower;
                }
            }

            if (gameState.feverActive) {
                gameState.feverTimer -= 100;
                if (gameState.feverTimer <= 0) {
                    gameState.feverActive = false;
                    document.getElementById('fever-bar-container').classList.add('hidden');
                    document.body.classList.remove('fever-mode');
                    document.getElementById('dialogue-icon').innerText = '🦜';
                    document.getElementById('dialogue-text').innerText = 'ニハシ: ﾜｶﾗﾅｲ';
                } else {
                    let pct = (gameState.feverTimer / 30000) * 100;
                    document.getElementById('fever-bar').style.width = pct + '%';
                }
            }

            updateUI();
        }

            let isCrit = Math.random() < gameState.critRate;

            if (isCrit) {

            document.getElementById('next-goal-text').innerText = `次(+${currentRunGained + 1}個)まであと: ${formatNum(Math.ceil(diff))} 💩`;

            const pBtn = document.getElementById('prestige-btn');
            if (currentRunGained > 0) {
                pBtn.disabled = false;
                pBtn.innerText = `黄金転生 (+${currentRunGained}個獲得)`;
            } else {
                pBtn.disabled = true;
                pBtn.innerText = '黄金転生 (条件未達)';
            }

            document.getElementById('divine-owned-display').innerText = `🌌神格: ${formatNum(gameState.divineReincarnations)}個 (全生産 x${formatNum(divineMultiplier)})`;
            let divineGained = calculateDivineGains();
            let nextDivineGoalCount = getNextDivineGoal(divineGained);
            let divineDiff = nextDivineGoalCount - gameState.goldenReincarnations;
            if (divineDiff < 0) divineDiff = 0;

            const dBtn = document.getElementById('divine-btn');
            if (gameState.goldenReincarnations >= 50 && divineGained > gameState.divineReincarnations) {
                dBtn.disabled = false;
                dBtn.innerText = `神格転生 (+${divineGained - gameState.divineReincarnations}個獲得)`;
                document.getElementById('divine-goal-text').innerText = `次(+${divineGained + 1}個)まであと黄金 ${formatNum(divineDiff)}個`;
            } else {
                dBtn.disabled = true;
                dBtn.innerText = gameState.goldenReincarnations < 50 ? '黄金50個で解放' : '神格転生 (条件未達)';
                document.getElementById('divine-goal-text').innerText = gameState.goldenReincarnations < 50 ? `黄金あと ${50 - gameState.goldenReincarnations}個必要` : `次まであと黄金 ${formatNum(divineDiff)}個`;
            }
        }

        function formatNum(num) {
            if (typeof num === 'string') num = parseFloat(num);
            if (num >= 1e68) return (num / 1e68).toFixed(2) + '無量大数';
            if (num >= 1e64) return (num / 1e64).toFixed(2) + '不可思議';
            if (num >= 1e60) return (num / 1e60).toFixed(2) + '那由多';
            if (num >= 1e56) return (num / 1e56).toFixed(2) + '阿僧祇';
            if (num >= 1e52) return (num / 1e52).toFixed(2) + '恒河沙';
            if (num >= 1e48) return (num / 1e48).toFixed(2) + '極';
            if (num >= 1e44) return (num / 1e44).toFixed(2) + '載';
            if (num >= 1e40) return (num / 1e40).toFixed(2) + '正';
            if (num >= 1e36) return (num / 1e36).toFixed(2) + '澗';
            if (num >= 1e32) return (num / 1e32).toFixed(2) + '溝';
            if (num >= 1e28) return (num / 1e28).toFixed(2) + '穣';
            if (num >= 1e24) return (num / 1e24).toFixed(2) + '🪷';
            if (num >= 1e20) return (num / 1e20).toFixed(2) + '🪸';
            if (num >= 1e16) return (num / 1e16).toFixed(2) + '京';
            if (num >= 1e12) return (num / 1e12).toFixed(2) + '兆';
            if (num >= 1e8) return (num / 1e8).toFixed(2) + '億';
            if (num >= 1e4) return (num / 1e4).toFixed(1) + '万';
            return num.toLocaleString();
        }

        function switchTab(idx) {
            gameState.currentTab = idx;
            for(let i=0; i<5; i++) {
                const btn = document.getElementById(`tab-${i}`);
                if(i === idx) {
                    btn.className = "flex-1 py-2 text-center rounded-xl bg-amber-600 text-white font-bold transition-all shadow";
                } else {
                    btn.className = "flex-1 py-2 text-center rounded-xl text-stone-400 transition-all";
                }
            }
            renderShop();
        }

        function renderShop() {
            const container = document.getElementById('shop-container');
            container.innerHTML = '';
            let cat = gameState.currentTab;
            let items = shopDatabase[cat];
            let catKey = ['gorilla', 'toucan', 'skunk', 'dog', 'facility'][cat];

            items.forEach((item, idx) => {
                let currentLevel = gameState.levels[catKey][idx];
                let currentCost = Math.floor(item.cost * Math.pow(1.28, currentLevel));
                
                let div = document.createElement('div');
                div.className = "bg-stone-900 p-2.5 rounded-2xl border border-stone-800 flex items-center justify-between shadow-sm";
                div.innerHTML = `
                    <div class="pr-2">
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-xs text-amber-200">${item.name}</span>
                            <span id="shop-lv-${cat}-${idx}" class="text-[10px] bg-amber-950 text-amber-400 px-1.5 py-0.5 rounded-md font-bold">Lv.${currentLevel}</span>
                        </div>
                        <p class="text-[10px] text-stone-400 mt-0.5">${item.desc}</p>
                        <p id="shop-cost-${cat}-${idx}" class="text-[10px] font-black text-amber-500 mt-0.5">費用: ${formatNum(currentCost)} 💩</p>
                    </div>
                `;
                let btn = document.createElement('button');
                btn.id = `shop-btn-${cat}-${idx}`;
                btn.className = "bg-amber-600 text-white text-xs font-bold px-3 py-2 rounded-xl shadow hover:bg-amber-700 active:scale-95 transition-all flex-shrink-0";
                btn.innerText = "購入";
                
                let shopHoldTimer = null;
                let shopIntervalTimer = null;

                const clearShopHold = () => {
                    if (shopHoldTimer) {
                        clearTimeout(shopHoldTimer);
                        shopHoldTimer = null;
                    }
                    if (shopIntervalTimer) {
                        clearInterval(shopIntervalTimer);
                        shopIntervalTimer = null;
                    }
                };

                btn.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    buyItem(cat, idx);

                    shopHoldTimer = setTimeout(() => {
                        if (shopIntervalTimer) clearInterval(shopIntervalTimer);
                        shopIntervalTimer = setInterval(() => {
                            buyItem(cat, idx);
                        }, 100);
                    }, 400);
                });

                btn.addEventListener('pointerup', clearShopHold);
                btn.addEventListener('pointercancel', clearShopHold);
                btn.addEventListener('mouseleave', clearShopHold);

                div.appendChild(btn);
                container.appendChild(div);
            });
        }

        function buyItem(cat, idx) {
            let catKey = ['gorilla', 'toucan', 'skunk', 'dog', 'facility'][cat];
            let item = shopDatabase[cat][idx];
            let currentLevel = gameState.levels[catKey][idx];
            let currentCost = Math.floor(item.cost * Math.pow(1.28, currentLevel));

            if (gameState.score >= currentCost) {
                gameState.score -= currentCost;
                gameState.levels[catKey][idx]++;

                if (cat === 0) {
                    gameState.autoPoopSec += item.cps;
                } else if (cat === 1) {
                    gameState.critRate += item.critAdd;
                    gameState.critMulti += item.multAdd;
                } else if (cat === 2) {
                    gameState.autoTapCount += item.autoTapAdd;
                } else if (cat === 3) {
                    gameState.manualPower += item.tapAdd;
                    gameState.synergyBonus += item.synAdd;
                }
                
                let newLevel = gameState.levels[catKey][idx];
                let nextCost = Math.floor(item.cost * Math.pow(1.28, newLevel));
                let lvEl = document.getElementById(`shop-lv-${cat}-${idx}`);
                let costEl = document.getElementById(`shop-cost-${cat}-${idx}`);
                if (lvEl) lvEl.innerText = `Lv.${newLevel}`;
                if (costEl) costEl.innerText = `費用: ${formatNum(nextCost)} 💩`;

                updateUI();
                saveGame();
            }
        }

        function buyMaxCurrentTab() {
            let cat = gameState.currentTab;
            let catKey = ['gorilla', 'toucan', 'skunk', 'dog', 'facility'][cat];
            let items = shopDatabase[cat];
            let purchasedAny = false;
            let safetyCounter = 0;

            while (safetyCounter < 500) {
                let boughtInThisRound = false;
                for (let idx = 0; idx < items.length; idx++) {
                    let item = items[idx];
                    let currentLevel = gameState.levels[catKey][idx];
                    let currentCost = Math.floor(item.cost * Math.pow(1.28, currentLevel));

                    if (gameState.score >= currentCost) {
                        gameState.score -= currentCost;
                        gameState.levels[catKey][idx]++;

                        if (cat === 0) {
                            gameState.autoPoopSec += item.cps;
                        } else if (cat === 1) {
                            gameState.critRate += item.critAdd;
                            gameState.critMulti += item.multAdd;
                        } else if (cat === 2) {
                            gameState.autoTapCount += item.autoTapAdd;
                        } else if (cat === 3) {
                            gameState.manualPower += item.tapAdd;
                            gameState.synergyBonus += item.synAdd;
                        }

                        purchasedAny = true;
                        boughtInThisRound = true;
                    }
                }
                if (!boughtInThisRound) break;
                safetyCounter++;
            }

            if (purchasedAny) {
                renderShop();
                updateUI();
                saveGame();
            }
        }

        function openPrestigeModal() {
            let netNew = calculateGoldenGains();
            if (netNew <= 0) {
                showModal("黄金転生", "まだ転生による獲得はありません。さらに累計うんちを稼ぐウホ！");
                return;
            }

            document.getElementById('modal-title').innerText = "✨ 黄金転生発動 ✨";
            document.getElementById('modal-text').innerHTML = `
                現在の累計うんちで転生すると、<br>
                新たに <span class="text-yellow-400 font-black text-sm">+${netNew}個</span> の黄金うんちを獲得できます！<br>
                <span class="text-[10px] text-stone-400 mt-2 block">※スコア、設備、ショップレベル、今回周の累計うんちがリセットされ、次の1個目の目標も100兆から再スタートします。</span>
            `;
            document.getElementById('modal-buttons').innerHTML = `
                <button onclick="closeModal()" class="flex-1 bg-stone-700 text-stone-300 font-bold py-2 rounded-xl text-xs">キャンセル</button>
                <button onclick="executePrestige(${netNew})" class="flex-1 bg-gradient-to-r from-amber-500 to-yellow-600 text-stone-950 font-black py-2 rounded-xl text-xs shadow">転生する</button>
            `;
            document.getElementById('msg-modal').classList.remove('hidden');
        }

        function executePrestige(gainedGolden) {
            gameState.goldenReincarnations += gainedGolden;
            gameState.score = 0;
            gameState.cumulative = 0; // 周回リセット
            gameState.manualPower = 1 + (gameState.goldenReincarnations * 0.5);
            gameState.autoPoopSec = 0;
            gameState.critRate = 0.05;
            gameState.critMulti = 3.0;
            gameState.autoTapCount = 0;
            gameState.synergyBonus = 1.0;
            gameState.levels = {
                gorilla: Array(30).fill(0),
                toucan: Array(30).fill(0),
                skunk: Array(30).fill(0),
                dog: Array(30).fill(0),
                facility: Array(30).fill(0)
            };
            closeModal();
            renderShop();
            updateUI();
            saveGame();
            showModal("転生完了", "黄金転生を果たしたウホ！新たな力でさらにモリモリ生産するウホ！");
        }

        function openDivineModal() {
            let potentialDivine = calculateDivineGains();
            let netNewDivine = potentialDivine - gameState.divineReincarnations;
            if (netNewDivine <= 0) {
                showModal("🌌 神格転生", "まだ神格転生による追加獲得はありません。さらに多くの黄金うんちを集めるウホ！");
                return;
            }

            document.getElementById('modal-title').innerText = "🌌 神格転生発動 🌌";
            document.getElementById('modal-text').innerHTML = `
                現在の所持黄金うんちで神格転生を行うと、<br>
                新たに <span class="text-purple-400 font-black text-sm">+${netNewDivine}個</span> の神格を獲得できます！<br>
                <span class="text-[10px] text-stone-400 mt-2 block">※スコア、黄金うんち、設備がリセットされますが、全生産効率が神格1個につき「2倍」に爆発的跳ね上がります！</span>
            `;
            document.getElementById('modal-buttons').innerHTML = `
                <button onclick="closeModal()" class="flex-1 bg-stone-700 text-stone-300 font-bold py-2 rounded-xl text-xs">キャンセル</button>
                <button onclick="executeDivine(${potentialDivine})" class="flex-1 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-black py-2 rounded-xl text-xs shadow">神格転生する</button>
            `;
            document.getElementById('msg-modal').classList.remove('hidden');
        }

        function executeDivine(newDivineGained) {
            gameState.divineReincarnations = newDivineGained;
            gameState.score = 0;
            gameState.cumulative = 0;
            gameState.goldenReincarnations = 0;
            gameState.manualPower = 1;
            gameState.autoPoopSec = 0;
            gameState.critRate = 0.05;
            gameState.critMulti = 3.0;
            gameState.autoTapCount = 0;
            gameState.synergyBonus = 1.0;
            gameState.levels = {
                gorilla: Array(30).fill(0),
                toucan: Array(30).fill(0),
                skunk: Array(30).fill(0),
                dog: Array(30).fill(0),
                facility: Array(30).fill(0)
            };
            closeModal();
            renderShop();
            updateUI();
            saveGame();
            showModal("神格降臨", "神格転生を果たしたウホ…！宇宙の真理たる圧倒的な全生産2倍の加護を手に入れたウホ！");
        }

        function openResetModal() {
            document.getElementById('modal-title').innerText = "⚠️ 全データリセット";
            document.getElementById('modal-text').innerText = "本当に全てのセーブデータを消去して初期化しますか？この操作は取り消せません。";
            document.getElementById('modal-buttons').innerHTML = `
                <button onclick="closeModal()" class="flex-1 bg-stone-700 text-stone-300 font-bold py-2 rounded-xl text-xs">キャンセル</button>
                <button onclick="resetGameData()" class="flex-1 bg-red-700 text-white font-black py-2 rounded-xl text-xs shadow">完全リセット</button>
            `;
            document.getElementById('msg-modal').classList.remove('hidden');
        }

        function resetGameData() {
            localStorage.removeItem('maximum_poop_clicker_save_v7');
            location.reload();
        }

        function showModal(title, text) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerHTML = text;
            document.getElementById('modal-buttons').innerHTML = `<button onclick="closeModal()" class="flex-1 bg-amber-600 text-white font-bold py-2 rounded-xl shadow hover:bg-amber-700 transition-colors text-xs">了解</button>`;
            document.getElementById('msg-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('msg-modal').classList.add('hidden');
        }

        function saveGame() {
            localStorage.setItem('maximum_poop_clicker_save_v7', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('maximum_poop_clicker_save_v7');
            if (saved) {
                try {
                    let parsed = JSON.parse(saved);
                    gameState = Object.assign(gameState, parsed);
                } catch(e) {
                    console.error("Failed to load save", e);
                }
            }
        }

        function initBackgroundSprites() {
            const canvas = document.getElementById('bg-canvas');
            const icons = ['💩', '🍌', '🦍', '🦜', '🦨', '🐕', '✨', '🌌'];
            for(let i=0; i<15; i++) {
                let span = document.createElement('span');
                span.className = 'bg-sprite';
                span.innerText = icons[Math.floor(Math.random() * icons.length)];
                span.style.top = (Math.random() * 100) + '%';
                span.style.left = (Math.random() * 100) + '%';
                canvas.appendChild(span);
            }
        }
    </script>
</body>
</html>
